name: Refresh 24-hour forecast holder

on:
  schedule:
    # GitHub cron is UTC. Singapore is UTC+8 year-round.
    # 15:30 UTC = 23:30 SGT (next-day lunch decision)
    # 21:30 UTC = 05:30 SGT (same-day dinner decision)
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign to preview or send
        required: true
        default: lunch
        type: choice
        options:
          - lunch
          - dinner
      send_live:
        description: Send live instead of performing a dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: forecast-24h-holder
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account JSON
        env:
          SA_JSON: ${{ secrets.SA_JSON }}
        run: |
          test -n "$SA_JSON"
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Sanity check JSON
        run: |
          python - <<'PY'
          import json, os
          path = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          with open(path, encoding="utf-8") as handle:
              json.load(handle)
          print("Service account JSON OK at:", path)
          PY

      - name: Refresh forecast_24h and notify Telegram
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CAMPAIGN: ${{ inputs.campaign }}
          MANUAL_SEND_LIVE: ${{ inputs.send_live }}
        run: |
          if [ "$EVENT_SCHEDULE" = "30 15 * * *" ]; then
            campaign="lunch"
          elif [ "$EVENT_SCHEDULE" = "30 21 * * *" ]; then
            campaign="dinner"
          else
            campaign="$MANUAL_CAMPAIGN"
          fi

          args=(--campaign "$campaign")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_SEND_LIVE" != "true" ]; then
            args+=(--dry-run)
          fi
          python forecast_24h_holder.py --notify "${args[@]}"

      - name: Cleanup credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
