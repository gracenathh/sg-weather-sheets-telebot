name: Refresh 24-hour forecast holder

on:
  schedule:
    # 8:45 PM SGT - Next-day lunch AND dinner forecast
    - cron: "45 15 * * *"
      timezone: "Asia/Singapore"

    # 8:45 AM SGT - Same-day dinner forecast
    - cron: "45 1 * * *"
      timezone: "Asia/Singapore"

  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign to preview or send
        required: true
        default: lunch
        type: choice
        options:
          - lunch
          - dinner
          - both
      target_date:
        description: "Optional campaign date (YYYY-MM-DD, Singapore time); blank = automatic"
        required: false
        default: ""
        type: string
      send_live:
        description: Send live instead of performing a dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: forecast-24h-holder
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account JSON
        env:
          SA_JSON: ${{ secrets.SA_JSON }}
        run: |
          test -n "$SA_JSON"
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Sanity check JSON
        run: |
          python - <<'PY'
          import json, os
          path = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          with open(path, encoding="utf-8") as handle:
              json.load(handle)
          print("Service account JSON OK at:", path)
          PY

      - name: Refresh forecast_24h and notify Telegram
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CAMPAIGN: ${{ inputs.campaign }}
          MANUAL_SEND_LIVE: ${{ inputs.send_live }}
          MANUAL_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              # GitHub can expose an empty input when an older workflow run is
              # re-run. Default to lunch instead of passing --campaign "".
              campaign="${MANUAL_CAMPAIGN:-lunch}"
              ;;
            schedule)
              case "$EVENT_SCHEDULE" in
                "45 20 * * *") campaign="both" ;;
                "45 8 * * *") campaign="dinner" ;;
                *)
                  echo "Unknown scheduled cron: '$EVENT_SCHEDULE'"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported GitHub event: '$EVENT_NAME'"
              exit 1
              ;;
          esac

          echo "Event: $EVENT_NAME; schedule: ${EVENT_SCHEDULE:-none}; campaign: $campaign"

          args=(--campaign "$campaign")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_TARGET_DATE" ]; then
            if ! [[ "$MANUAL_TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid target_date. Use YYYY-MM-DD (example: 2026-10-11)."
              exit 1
            fi
            args+=(--target-date "$MANUAL_TARGET_DATE")
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            args+=(--enforce-send-window)
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_SEND_LIVE" != "true" ]; then
            args+=(--dry-run)
          fi
          python forecast_24h_holder.py --notify "${args[@]}"

      - name: Cleanup credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
