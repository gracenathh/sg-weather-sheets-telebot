name: Refresh 24-hour forecast holder

on:
  schedule:
    # GitHub cron is UTC. Singapore is UTC+8 year-round.
    # 12:00 UTC = 20:00 SGT (next-day lunch message)
    # 01:00 UTC = 09:00 SGT (same-day dinner message)
    - cron: "0 12 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign to preview or send
        required: true
        default: lunch
        type: choice
        options:
          - lunch
          - dinner
      send_live:
        description: Send live instead of performing a dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: forecast-24h-holder
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account JSON
        env:
          SA_JSON: ${{ secrets.SA_JSON }}
        run: |
          test -n "$SA_JSON"
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Sanity check JSON
        run: |
          python - <<'PY'
          import json, os
          path = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          with open(path, encoding="utf-8") as handle:
              json.load(handle)
          print("Service account JSON OK at:", path)
          PY

      - name: Refresh forecast_24h and notify Telegram
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CAMPAIGN: ${{ inputs.campaign }}
          MANUAL_SEND_LIVE: ${{ inputs.send_live }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              # GitHub can expose an empty input when an older workflow run is
              # re-run. Default to lunch instead of passing --campaign "".
              campaign="${MANUAL_CAMPAIGN:-lunch}"
              ;;
            schedule)
              case "$EVENT_SCHEDULE" in
                "0 12 * * *") campaign="lunch" ;;
                "0 1 * * *") campaign="dinner" ;;
                *)
                  echo "Unknown scheduled cron: '$EVENT_SCHEDULE'"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported GitHub event: '$EVENT_NAME'"
              exit 1
              ;;
          esac

          echo "Event: $EVENT_NAME; schedule: ${EVENT_SCHEDULE:-none}; campaign: $campaign"

          args=(--campaign "$campaign")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_SEND_LIVE" != "true" ]; then
            args+=(--dry-run)
          fi
          python forecast_24h_holder.py --notify "${args[@]}"

      - name: Cleanup credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
