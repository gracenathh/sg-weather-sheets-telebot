
name: Refresh 24-hour forecast holder

on:
  # Cloudflare Worker trigger
  repository_dispatch:
    types:
      - trigger-24h-weather

  # Existing GitHub schedules for Telegram notifications
  schedule:
    # 8:45 PM SGT - Next-day lunch AND dinner forecast
    - cron: "45 20 * * *"
      timezone: "Asia/Singapore"

    # 8:45 AM SGT - Same-day dinner forecast
    - cron: "45 8 * * *"
      timezone: "Asia/Singapore"

  # Manual execution from GitHub Actions
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign to preview or send
        required: true
        default: lunch
        type: choice
        options:
          - lunch
          - dinner
          - both

      target_date:
        description: "Optional campaign date (YYYY-MM-DD, Singapore time); blank = automatic"
        required: false
        default: ""
        type: string

      send_live:
        description: Send live instead of performing a dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: forecast-24h-holder
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account JSON
        env:
          SA_JSON: ${{ secrets.SA_JSON }}
        run: |
          test -n "$SA_JSON"
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Sanity check JSON
        run: |
          python - <<'PY'
          import json
          import os

          path = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]

          with open(path, encoding="utf-8") as handle:
              json.load(handle)

          print("Service account JSON OK at:", path)
          PY

      # ------------------------------------------------------
      # CLOUDFLARE TRIGGER
      # Refresh Google Sheets only.
      # No Telegram messages.
      # ------------------------------------------------------
      - name: Refresh 24H forecast from Cloudflare
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Cloudflare triggered 24H forecast refresh"
          python forecast_24h_holder.py

      # ------------------------------------------------------
      # GITHUB SCHEDULE / MANUAL TRIGGER
      # Keep existing Telegram notification behavior.
      # ------------------------------------------------------
      - name: Refresh forecast_24h and notify Telegram
        if: github.event_name != 'repository_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CAMPAIGN: ${{ inputs.campaign }}
          MANUAL_SEND_LIVE: ${{ inputs.send_live }}
          MANUAL_TARGET_DATE: ${{ inputs.target_date }}

        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              # Default to lunch if input is empty
              campaign="${MANUAL_CAMPAIGN:-lunch}"
              ;;

            schedule)
              case "$EVENT_SCHEDULE" in
                "45 20 * * *")
                  campaign="both"
                  ;;
                "45 8 * * *")
                  campaign="dinner"
                  ;;
                *)
                  echo "Unknown scheduled cron: '$EVENT_SCHEDULE'"
                  exit 1
                  ;;
              esac
              ;;

            *)
              echo "Unsupported GitHub event: '$EVENT_NAME'"
              exit 1
              ;;
          esac

          echo "Event: $EVENT_NAME"
          echo "Schedule: ${EVENT_SCHEDULE:-none}"
          echo "Campaign: $campaign"

          args=(--campaign "$campaign")

          # Optional manual target date
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_TARGET_DATE" ]; then
            if ! [[ "$MANUAL_TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid target_date. Use YYYY-MM-DD."
              exit 1
            fi

            args+=(--target-date "$MANUAL_TARGET_DATE")
          fi

          # Enforce notification window for scheduled runs
          if [ "$EVENT_NAME" = "schedule" ]; then
            args+=(--enforce-send-window)
          fi

          # Manual runs default to dry run
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_SEND_LIVE" != "true" ]; then
            args+=(--dry-run)
          fi

          python forecast_24h_holder.py --notify "${args[@]}"

      # ------------------------------------------------------
      # CLEANUP
      # ------------------------------------------------------
      - name: Cleanup credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
